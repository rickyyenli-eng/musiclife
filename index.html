<script>
/* ===== 種子亂數 ===== */
function hashSeed(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}
return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^=h>>>16)>>>0}}
let RNG=null;
function mkRNG(seed){let s=hashSeed(seed)();return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);
t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=()=>RNG(),pick=a=>a[Math.floor(rnd()*a.length)];
const newSeed=()=>Math.random().toString(36).slice(2,10);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd0=v=>{const n=Math.round(v);return Object.is(n,-0)?0:n};   // 避免印出 -0

/* ===== 職業 =====
   每個職業盯的數字不一樣，body 是他會燒掉的那個東西 */
const CAREERS={
 singer:{n:'歌手',d:'站在前面的人',fameL:'聲量',bodyL:'嗓子',craftL:'唱功',
   unit:'人',metric:'演出場次',inc:0.6,cut:{hi:90,mid:72,lo:39,gap:38},e:{fame:6,craft:-1,body:0}},
 producer:{n:'製作人',d:'讓別人聽起來很好的人',fameL:'掛名',bodyL:'耳朵',craftL:'品味',
   unit:'首',metric:'掛名作品',inc:1.8,cut:{hi:49,mid:32,lo:14,gap:58},e:{craft:4,fame:-1,body:2}},
 writer:{n:'詞曲作者',d:'歌比你先被認識',fameL:'被唱',bodyL:'存量',craftL:'筆力',
   unit:'次',metric:'被唱過的歌',inc:0.9,cut:{hi:42,mid:26,lo:12,gap:56},e:{craft:6,fame:-3,body:-2}},
 session:{n:'樂手',d:'被指名的那雙手',fameL:'通告',bodyL:'手',craftL:'技術',
   unit:'場',metric:'錄音／演出場次',inc:2.6,cut:{hi:60,mid:37,lo:16,gap:60},e:{craft:7,fame:-2,body:-1}},
 teacher:{n:'音樂老師',d:'把東西交出去的人',fameL:'口碑',bodyL:'熱情',craftL:'底子',
   unit:'人',metric:'教過的學生',inc:2.4,cut:{hi:44,mid:28,lo:12,gap:59},e:{craft:3,fame:-2,body:4,money:6}}
};
/* 四種天賦原型，五個職業各有各的說法，但吃的是同一套倍率 */
const ARCH={
 A:{n:'精準',craft:1.18,bias:0.72,d:'你聽得出自己哪裡不對，而且改得掉。',dEnd:'學得比別人快，但你對自己永遠比別人嚴——自評會一直低於實力'},
 B:{n:'外放',fame:1.30,bias:1.45,d:'你站得上去，也開得了口。',dEnd:'數字漲得比別人快，自我感覺也漲得比別人快'},
 C:{n:'特色',craft:1.22,wear:1.55,d:'沒有人會把你認成別人。',dEnd:'辨識度高，代價是你比別人耗得快'},
 D:{n:'耐操',wear:0.55,yips:0.50,d:'你比別人不容易壞。',dEnd:'磨損慢，大場面也不太抖——但你沒有特別突出的地方'}
};
const TRAITS={
 singer:{label:'你的聲線',opts:{'清亮':'A','高亢':'B','沙啞':'C','低沉':'D'}},
 producer:{label:'你的耳朵天生',opts:{'很準':'A','很快':'B','很挑':'C','很雜食':'D'}},
 writer:{label:'你寫東西靠的是',opts:{'邏輯':'A','耳朵':'B','情緒':'C','記性':'D'}},
 session:{label:'你的手天生',opts:{'視譜快':'A','即興強':'B','音色特別':'C','拍子穩':'D'}},
 teacher:{label:'你天生',opts:{'很會示範':'A','很會鼓勵':'B','要求很高':'C','有耐心':'D'}}
};
const TR=s=>ARCH[s.arch]||ARCH.D;
const trM=(s,k)=>{const t=TR(s);return t[k]===undefined?1:t[k]};
const RIVALS=['李芷寧','阿凱','周子恆','Vera','小鹿'];
const C=s=>CAREERS[s.career];

/* ===== 狀態 ===== */
let S=null;
function newGame(name,career,vtype,seed){
  RNG=mkRNG(seed);
  const s={seed,name,career,vtype,arch:'D',age:16,year:2026,
    craft:20,fame:3,body:80,money:0,
    bias:0,optimism:50,yips:0,
    comparing:true,rivalFame:5,rivalName:pick(RIVALS),
    trap:0,pushed:0,attrib:[],taught:null,stopCompareAge:null,pts:0,spent:{craft:0,fame:0,body:0,mind:0},bets:0,betWins:0,betExp:0,betNear:0,chase:0,lastLoseAge:null,
    student:0,path:[],history:[],log:[],used:new Set(),
    works:0,worksSum:0,peakWork:0,over:false};
  const e=CAREERS[career].e;for(const k in e)s[k]+=e[k];
  s.arch=TRAITS[career].opts[vtype]||'D';
  if(s.arch==='D')s.body+=6;   // 耐操的人底子厚一點
  s.path.push({age:16,c:career});
  return s;
}
const shown=s=>{                       // 軟上限：越高越難再漲，但永遠不會撞到天花板變成平的
  const raw=s.craft+s.bias;
  if(raw>85) return Math.round(85+(1-Math.exp(-(raw-85)/22))*14);
  if(raw<15) return Math.round(15-(1-Math.exp(-(15-raw)/12))*12);
  return Math.round(raw);
};
const reach=s=>Math.max(3,Math.round(5+Math.pow(s.fame,1.72)/2.4));
const felt=(s,n)=>Math.max(1,Math.round(n*(1+s.bias/55)));

/* ===== 事件 ===== */
const EV=[
/* ---------- 第一幕：共用（16-21） ---------- */
{id:'first',p:1,must:1,t:'第一次被聽見',
 x:s=>({singer:'校慶舞台，你排在熱舞社後面。麥克風高度不對，沒人幫你調。',
  producer:'你把自己混的第一版丟給同學聽。他戴上耳機，聽了四十秒。',
  writer:'你把歌詞印出來給人看。他一邊看一邊笑，你不知道是哪一種笑。',
  session:'第一次幫別人伴奏。你練了兩個禮拜，他前一天才把譜給你。',
  teacher:'你教隔壁班的人彈那首歌。他學會的那個瞬間你比自己學會還爽。'})[s.career],
 c:[{l:'照最有把握的做',e:{craft:3,fame:3},r:s=>`結束了。大概${reach(s)}個人有真的在聽。`,o:-1,int:70},
    {l:'放進一個沒人要求的東西',e:{craft:6,fame:1},r:'中間垮掉一次，但有一個人回頭問你那是什麼。',o:-1,int:78}]},

{id:'mimic',p:1,must:1,t:'你很像誰',
 x:s=>'有人跟你說：「這聽起來很像某某某。」你不確定這是不是誇獎。',
 c:[{l:'那就更像一點，比較快',e:{fame:6,craft:-2,bias:5},r:'很順。有人說「聽起來很專業」，沒有人說「聽起來是你」。',o:0,int:45},
    {l:'把那個習慣拆掉，重來',e:{craft:8,fame:-2,body:-3},r:'接下來半年你做得比以前爛。只有你知道為什麼。',o:0,int:62}]},

{id:'notes',p:1,t:'講評',
 x:s=>'紙上寫著一句：「技術沒問題，但我不會記得。」',
 c:[{l:'把技術練到無懈可擊',e:{craft:5,yips:6},r:'你開始錄下自己每一次，聽到第三遍會不想聽。',o:-1,int:55},
    {l:'去找只有你會做的那件事',e:{craft:4,fame:2},r:'你翻出家裡那卷卡帶，聽了一整晚。',o:0,int:66}]},

{id:'family',p:1,must:1,t:'家裡',
 x:s=>'「音樂可以，但你先給我考個能吃飯的。」',

{id:'trap1',p:1,trap:1,t:'那個地方',

{id:'gear',p:1,t:'器材',

{id:'school',p:1,t:'科班',

    {l:'自己來',e:{craft:4,money:3},r:'你少了一張紙，多了三年時間，跟很多不知道對不對的習慣。',o:0,int:56}]},

{id:'upload',p:1,t:'放上網',

/* ---------- 賭一把：機率直接寫在選項上 ---------- */

{id:'g_singer',p:2,car:'singer',t:'自己辦一場',

  {l:'再等一年，先把歌練好',e:{craft:5,money:4},r:'你等了。一年後那個檔期被別人訂走了。',o:0,int:45}]},

{id:'g_producer',p:2,car:'producer',t:'賭一個新人',
 x:s=>'一個沒人要簽的新人。你聽到他的 demo 第一句就知道了——但你也知道自己聽錯過很多次。',

   win:{fame:30,money:14,craft:5},winR:'那張賣爆了。他每次受訪都會提到你的名字。',
   lose:{money:-30,fame:-8,craft:2},loseR:'賣了三百張。他隔年就去考公職了，你連母帶都還留著。',
   loseSwitch:'session'},
  {l:'介紹給別家，收個介紹費',e:{money:8,fame:2},r:'他在別人手上紅了。你在頒獎典禮的觀眾席看完全程。',o:0,int:70}]},

{id:'g_writer',p:2,car:'writer',t:'押在自己身上',
 x:s=>'手上有一筆版稅。可以放著，也可以全部拿去做你自己那張沒人要的專輯。',
 c:[{l:'全部押下去（成功機率 30%）',prob:0.30,int:92,
   win:{fame:24,craft:8,money:-6},winR:'那張被一個很挑的樂評寫了長文。訂單從那天開始沒停過。',
   lose:{money:-24,fame:-4,craft:4},loseR:'賣了兩百多張。你把剩下的搬回家，堆在客廳三年。'},
  {l:'放著，接下一個案子',e:{money:12,craft:1},r:'穩定。你每個月都知道自己會拿到多少。',o:0,int:40}]},

{id:'g_session',p:3,car:'session',t:'不接通告了',
 x:s=>'你三十幾歲了，第一次認真想做自己的東西。代價是要推掉整年的通告。',

   win:{craft:14,fame:18,money:-12},winR:'那張入圍了。從此他們找你不是因為你便宜，是因為那是你。',
   lose:{craft:4,fame:-14,money:-22},loseR:'做完了，沒什麼人聽。回頭找通告時，位置已經被年輕人坐滿了。',
   loseSwitch:'teacher'},
  {l:'照常接，晚上做一點',e:{money:14,craft:3,body:-6},r:'兩邊都做了一點，兩邊都沒做完。',o:0,int:55}]},

{id:'g_teacher',p:3,car:'teacher',t:'開自己的教室',
 x:s=>'房東要收回場地。你可以搬去別家，也可以把積蓄拿出來開自己的。',
 c:[{l:'開下去（成功機率 35%）',prob:0.35,int:92,
   win:{money:22,fame:16,student:12},winR:'第二年就滿班了。你終於可以照自己的想法教。',
   lose:{money:-26,fame:-6,body:-10},loseR:'撐了十四個月。收掉那天你自己搬走最後一台琴。'},
  {l:'搬去別家，繼續教',e:{money:6,student:4},r:'課表沒變，只是通勤多了四十分鐘。',o:0,int:45}]},

{id:'g_any',p:3,t:'有人找你投資',
 x:s=>'一個做音樂的朋友要開公司，缺一筆錢。他說三年後翻倍還你。',
 c:[{l:'投（成功機率 40%）',prob:0.40,int:80,
   win:{money:34,fame:6},winR:'三年後他真的還了，而且多還一成。你們現在還會一起吃飯。',
   lose:{money:-28,fame:-2},loseR:'公司第二年就收了。他沒有躲你，只是每次見面都很尷尬。'},
  {l:'不投，但幫他介紹人',e:{fame:4,money:2},r:'他後來做起來了。你在他的感謝名單裡，第九個。',o:0,int:50}]},

/* ---------- 第二幕：歌手 ---------- */
{id:'s_edit',p:2,car:'singer',must:1,t:'剪接',
 x:s=>'節目播出，你被剪成一個「為了家人而唱」的人。你媽看了很感動。',
 c:[{l:'配合，這對曝光有用',e:{fame:13,craft:-3,bias:7},r:'路上有人認出你，喊的是那個人設。',o:1,int:66},
    {l:'公開說那不是我',e:{fame:-5,craft:4},r:'之後他們沒有再找你。你睡得比較好。',o:-1,int:76}]},
{id:'s_deal',p:2,car:'singer',must:1,t:'合約',
 x:s=>'抽成很重，但他們有歌、有通路。附帶一條：選歌權在公司。',
 c:[{l:'簽',e:{fame:15,money:12,craft:-3},r:'第一次有人幫你排行程，也是第一次你唱不喜歡的歌。',o:1,int:70},
    {l:'自己來',e:{craft:7,money:-10},r:'你自己接通告、自己排練、自己搬東西。',o:0,int:66}]},
{id:'s_tune',p:2,car:'singer',t:'修音',
 x:s=>'那句唱得有情緒但音是歪的。工程師說：「修一下三十秒就好。」',

    {l:'留著',e:{craft:6,fame:-1},r:'有人留言：「這句好像快哭了。」',o:1,int:68}]},
{id:'s_tour',p:2,car:'singer',must:1,t:'巡演',
 x:s=>'第四天你起床發現聲音只剩一半。後面還有八場。',
 c:[{l:'降 key 照唱',e:{fame:8,body:-6,craft:2},r:'觀眾沒發現。你發現了。',o:0,int:64},
    {l:'取消兩場',e:{money:-10,fame:-4,body:6},r:'留言有人說「不專業」。',o:-1,int:70},
    {l:'打針上台',e:{fame:11,body:-16,money:4},r:'那是整趟最好的一場，也是聲帶開始壞掉的那一場。',o:1,int:86}]},
{id:'s_trap2',p:2,car:'singer',trap:1,t:'直播',
 x:s=>'全開麥。前奏的時候你想起上次破音的片段還在網路上。',
 c:[{l:'反覆告訴自己：不要想上次',e:{yips:20,fame:-4},r:'你越不想那個畫面，那個畫面越清楚。第一句就抖了。',o:-1,int:86},
    {l:'看著第一排一個人唱',e:{fame:10,craft:4},r:'唱完你才想起來剛剛在直播。',o:1,int:84}]},

{id:'p_bad',p:2,car:'producer',must:1,t:'第一個案子',

    {l:'照原樣交，反正會紅',e:{money:10,fame:6,craft:-5,bias:4},r:'紅了。你在 KTV 聽到的時候換了首歌。',o:0,int:64}]},
{id:'p_credit',p:2,car:'producer',must:1,t:'掛名',
 x:s=>'東西是你做的。公司說這次掛老闆的名字，下次一定給你。',

    {l:'不答應，寧可退案',e:{fame:2,money:-10,craft:4},r:'案子沒了。半年後有人因為這件事找上你。',o:0,int:74}]},
{id:'p_invisible',p:2,car:'producer',t:'訪問',

{id:'p_change',p:2,car:'producer',t:'他要變成別人',

 c:[{l:'照他要的做',e:{money:10,fame:6,craft:-4},r:'成績不錯。他後來沒有再紅過。',o:0,int:60},
    {l:'把他真正好的地方挖出來',e:{craft:9,fame:2,body:-5},r:'錄了六個晚上。第七晚他唱了一次，你們都知道就是那次。',o:1,int:88}]},
{id:'p_trap2',p:2,car:'producer',trap:1,t:'混音',
 x:s=>'交件前一晚。你知道自己的老毛病是加太多。',
 c:[{l:'一直提醒自己：不要再加了、不要再加了',e:{yips:20,craft:-3},r:'你聽了四十遍。最後那版比第三版多了七軌。',o:-1,int:80},
    {l:'交出第三版，關電腦',e:{craft:6,fame:4},r:'第三版就是對的。你其實一開始就知道。',o:1,int:78}]},

/* ---------- 第二幕：詞曲作者 ---------- */
{id:'w_sell',p:2,car:'writer',must:1,t:'賣斷還是抽成',

{id:'w_brief',p:2,car:'writer',must:1,t:'命題',
 x:s=>'需求單上寫：「25-35 女性、失戀但不悲傷、副歌要好記、三天內。」',

    {l:'寫你真的想寫的那版一起交',e:{craft:8,fame:1,body:-5},r:'他們選了第一版。第二版在你硬碟裡待了六年。',o:-1,int:78}]},
{id:'w_mine',p:2,car:'writer',t:'那是誰的故事',

    {l:'發文說明那是我寫的',e:{fame:7,craft:-2},r:'吵了兩天。有人說你在消費，有人說你活該。',o:-1,int:80}]},
{id:'w_own',p:2,car:'writer',t:'沒人要的那首',

    {l:'收起來',e:{craft:2,bias:-5},r:'資料夾名稱是那年的年份。',o:-1,int:70}]},
{id:'w_trap2',p:2,car:'writer',trap:1,t:'截稿',
 x:s=>'剩十二小時。上一首太成功了，你最怕寫出一樣的東西。',
 c:[{l:'一直告訴自己：不要重複、不要像上一首',e:{yips:20,craft:-3},r:'你刪掉七個開頭。交出去的是第八個，你自己都不喜歡。',o:-1,int:82},
    {l:'先寫完再說，難聽也寫完',e:{craft:7,fame:3},r:'寫完之後改了三次。第三次的時候它變成別的東西了。',o:1,int:80}]},

{id:'x_trap2',p:2,car:'session',trap:1,t:'獨奏',

    {l:'把它當成第一次彈',e:{craft:6,fame:5},r:'一次過。控制室有人比大拇指。',o:1,int:82}]},
{id:'x_own',p:2,car:'session',t:'自己的東西',
 x:s=>'有人問你：「你什麼時候要做自己的作品？」你已經被問第九次了。',
 c:[{l:'做，把接案減半',e:{craft:8,money:-12,fame:3},r:'你做了一張。技術好得驚人，沒什麼人聽。',o:0,int:80},
    {l:'不做，我就是喜歡彈',e:{craft:5,money:8},r:'你講得很輕鬆。回家路上想了一路。',o:0,int:70}]},

function applyE(s,e){
  const d={};
  for(const k in e){let v=e[k];
    if(k==='craft'&&v>0){v*=(1-s.craft/115);v*=(1-s.yips/300);v*=trM(s,'craft');if(s.body<40)v*=0.6}
    if(k==='fame'&&v>0)v*=trM(s,'fame');
    if(k==='body'&&v<0)v*=trM(s,'wear');
    if(k==='yips'&&v>0)v*=trM(s,'yips');
    s[k]=(s[k]||0)+v;d[k]=v}
  s.craft=clamp(s.craft,1,100);s.fame=clamp(s.fame,0,100);s.body=clamp(s.body,0,100);
  s.yips=clamp(s.yips,0,100);s.bias=clamp(s.bias,-38,38);s.optimism=clamp(s.optimism,0,100);
  s.student=clamp(s.student||0,0,200);
  return d;
}
const phaseOf=a=>a<=21?1:a<=30?2:3;
function nextEvent(s){
  const p=phaseOf(s.age);
  const pool=EV.filter(e=>e.p===p&&!s.used.has(e.id)&&(!e.car||e.car===s.career)&&(!e.cmp||s.comparing));
  const must=pool.filter(e=>e.must);
  if(must.length&&(rnd()<0.5||pool.length===must.length))return pick(must);
  return pool.length?pick(pool):null;
}

function hud(){const s=S,c=C(s);return `<div class="hud"><div class="hud-row">
  <div class="stat"><span class="k">AGE</span><span class="v">${s.age}</span></div>
  <div class="stat"><span class="k">${c.craftL}</span><span class="v">${shown(s)}</span></div>

  <div class="stat"><span class="k">錢(萬)</span><span class="v${s.money<0?' warn':''}">${rnd0(s.money)}</span></div>
  </div><div class="selfnote">※ ${c.craftL}為自我評估值</div></div>`}
function render(i){app.innerHTML=hud()+`<div class="scene">${i}</div>`;window.scrollTo(0,0)}

function turn(){
  const s=S;
  if(s.body<=12)return ending('body');
  if(s.money<-55)return ending('broke');
  if(s.age>=42)return ending('auto');
  if((s.age===27||s.age===33)&&!s.used.has('sw'+s.age))return switchScreen();
  if([20,24,28,32,36,40].indexOf(s.age)>=0&&!s.used.has('tr'+s.age)&&s.pts>0)return trainScreen();
  const ev=(rnd()<0.10&&s.age>18&&s.age<40)?null:nextEvent(s);
  if(!ev){const f=pick(FILLER);
    render(`<div class="age-mark">${s.age} 歲 · ${s.year}</div><h2>${f.t}</h2><p class="body-text">${f.x}</p>
      <div class="opts"><button class="opt" id="k">繼續 ▸</button></div>`);
    document.getElementById('k').onclick=()=>{advance();turn()};return}
  s.used.add(ev.id);
  const x=typeof ev.x==='function'?ev.x(s):ev.x;
  render(`<div class="age-mark">${s.age} 歲 · ${s.year}</div><h2>${ev.t}</h2><p class="body-text">${x}</p>
    <div class="opts">${ev.c.map((c,i)=>`<button class="opt" data-i="${i}">${c.l}</button>`).join('')}</div>`);
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(ev,ev.c[+b.dataset.i]));
}

function trainScreen(){
  const s=S,c=C(s);
  const sess={craft:0,fame:0,body:0,mind:0};   // 這一次按了幾點，跟總累積分開看
  const TR_OPTS=[
    {k:'craft',t:'練基本功',d:`把時間丟進去，${c.craftL}會長`,run:()=>applyE(s,{craft:1.9})},
    {k:'fame',t:'跑曝光',d:`到處露臉、經營、認識人，${c.fameL}會漲`,run:()=>applyE(s,{fame:1.9})},
    {k:'body',t:'保養',d:`睡覺、復健、少接一點，${c.bodyL}回得來`,run:()=>applyE(s,{body:3.6})},
    {k:'mind',t:'心理素質',d:'看醫生、練呼吸、學會不去想那件事',run:()=>{s.yips=clamp(s.yips-7,0,100);s.optimism=clamp(s.optimism+2,0,100)}}
  ];
  const draw=()=>{
    render(`<div class="age-mark">${s.age} 歲 · ${s.year}</div><h2>這幾年你要練什麼</h2>
      <p class="body-text">剩下 <b class="mono" style="color:var(--amber);font-size:1.3rem">${s.pts}</b> 點${(()=>{const t=Object.values(sess).reduce((a,b)=>a+b,0);return t?`　·　這次已投入 ${t} 點`:''})()}。沒用掉的會留到下次。</p>
      <div class="opts">${(s.pts>0?TR_OPTS:[]).map((o,i)=>`<button class="opt" data-p="${i}">${o.t}　<span class="muted">${o.d}</span><span class="mono" style="float:right"><span style="color:var(--cyan)">${sess[o.k]?'+'+sess[o.k]:'　'}</span><span style="color:var(--dim);font-size:.78em;margin-left:10px">共 ${s.spent[o.k]}</span></span></button>`).join('')}
      <button class="opt" id="trdone" style="border-left-color:var(--cyan)">${s.pts>0?'剩下的留著 ▸':'練完了 ▸'}</button></div>`);
    document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
      if(s.pts<=0)return;const o=TR_OPTS[+b.dataset.p];o.run();s.spent[o.k]++;sess[o.k]++;s.pts--;draw()});
    document.getElementById('trdone').onclick=()=>{s.used.add('tr'+s.age);turn()};
  };
  draw();
}

function switchScreen(){
  const s=S;s.used.add('sw'+s.age);
  const opts=SWITCH[s.career];
  render(`<div class="age-mark">${s.age} 歲 · ${s.year}</div><h2>岔路</h2>
    <p class="body-text">你${s.age===27?'在這行第十一年':'快三十五了'}。有些門現在還開著，再過幾年就不一定。</p>
    <div class="opts">
      <button class="opt" id="stay">留在原地，我還沒做完</button>
      ${opts.map((o,i)=>`<button class="opt switch" data-s="${i}">轉做${CAREERS[o[0]].n}——${o[1]}</button>`).join('')}
    </div>`);
  document.getElementById('stay').onclick=()=>{s.craft+=3;advance();turn()};
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{
    const to=opts[+b.dataset.s][0];
    s.career=to;s.path.push({age:s.age,c:to});
    s.fame=Math.round(s.fame*0.68);s.craft=Math.round(s.craft*0.88);s.body=clamp(s.body+12,0,100);s.bias*=0.6;
    const shared=new Set(EV.filter(e=>!e.car).map(e=>e.id));
    s.used=new Set([...s.used].filter(k=>k.startsWith('sw')||shared.has(k)));
    s.log.push({age:s.age,t:'轉行',line:`你把自己拆掉一半，換到另一個位置。名片上的字換了。`,int:80,o:0,aud:null});
    advance();turn()});
}

function choose(ev,c){
  const s=S;
  let won=null;
  if(c.prob!==undefined){                    // 賭一把：機率是寫在選項上的那個數字
    const roll=rnd();won=roll<c.prob;
    if(s.lastLoseAge!==null&&s.age-s.lastLoseAge<=6)s.chase++;   // 剛輸完又賭＝追損
    s.bets++;s.betExp+=c.prob;if(won)s.betWins++;
    const near=!won&&(roll-c.prob)<0.08;
    if(near)s.betNear++;
    s.rollNote=`你骰到 ${Math.round(roll*100)}，門檻是 ${Math.round(c.prob*100)}。`+(near?'差一點。':'');
    if(!won)s.lastLoseAge=s.age;else s.lastLoseAge=null;
    c=Object.assign({},c,{e:won?c.win:c.lose,r:won?c.winR:c.loseR,o:won?1:-1});
    if(!won&&c.loseSwitch&&c.loseSwitch!==s.career){
      const to=c.loseSwitch;s.career=to;s.path.push({age:s.age,c:to});
      s.fame=Math.round(s.fame*0.7);s.craft=Math.round(s.craft*0.85);
      const shared=new Set(EV.filter(e=>!e.car).map(e=>e.id));
      s.used=new Set([...s.used].filter(k=>k.startsWith('sw')||k.startsWith('tr')||shared.has(k)));
    }
  }
  const d=applyE(s,c.e||{});
  if(ev.trap&&c.e&&c.e.yips)s.trap++;
  if(c.e&&c.e.body<-8)s.pushed++;
  if(c.taught)s.taught=c.taught;
  if(c.stopcmp){s.comparing=false;s.stopCompareAge=s.age}
  if(c.e&&c.e.fame>0){s.works++;s.worksSum+=reach(s);s.peakWork=Math.max(s.peakWork,reach(s))}
  let r=typeof c.r==='function'?c.r(s):c.r;
  if(s.rollNote){r=r+'　'+s.rollNote;s.rollNote=null}   // 差一點要讓玩家看見，不然沒有意義
  if(ev.id==='rival2'||ev.id==='rivalbig')s.lastRival=s.age;
  s.log.push({age:s.age,t:ev.t,line:r,int:c.int||30,o:c.o,unit:C(s).unit,aud:(c.e&&c.e.fame>=8&&c.o>=0)?reach(s):null});
  const bm=trM(s,'bias');
  if(d.fame)s.bias+=d.fame*0.35*bm;
  if(c.o>0)s.bias+=(3.4+(s.optimism-50)/18)*bm;else if(c.o<0)s.bias-=(3.6-(s.optimism-50)/16)*bm;
  s.bias*=0.975;
  const cc=C(s),nm={craft:cc.craftL,fame:cc.fameL,body:cc.bodyL,money:'錢',student:'帶人'};
  const dl=Object.entries(d).filter(([k,v])=>nm[k]&&Math.abs(v)>0.4)
    .map(([k,v])=>`<span class="${v>0?'up':'down'}">${nm[k]} ${v>0?'+':''}${Math.round(v)}</span>`).join('');
  let h=`<div class="age-mark">${s.age} 歲 · ${s.year}</div><h2>${ev.t}</h2>
    <div class="outcome${c.o<0?' bad':''}">${r}${dl?`<div class="deltas">${dl}</div>`:''}</div>`;
  if(c.end){render(h+`<div class="opts"><button class="opt" id="k">走過去 ▸</button></div>`);
    document.getElementById('k').onclick=()=>ending('chosen');return}
  if(c.o<0&&s.attrib.length<5){
    h+=`<p class="muted" style="margin-top:18px">你怎麼跟自己解釋這件事？</p>
      <div class="opts">${ATTRIB.map((a,i)=>`<button class="opt" data-a="${i}">${a.l}</button>`).join('')}</div>`;
    render(h);
    document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=ATTRIB[+b.dataset.a];
      s.attrib.push(a.k);s.optimism=clamp(s.optimism+a.opt,0,100);s.craft+=a.craft;s.bias+=a.opt>0?2.2:-1.8;afterTurn()});
    return}
  render(h+`<div class="opts"><button class="opt" id="k">下一年 ▸</button></div>`);
  document.getElementById('k').onclick=afterTurn;
}

function afterTurn(){
  const s=S;
  s.rivalFame=clamp(s.rivalFame+rnd()*5+(rnd()<0.12?12:0),0,100);
  if(s.comparing&&s.age%4===0&&s.age>20&&s.age<38&&s.age-(s.lastRival||-9)>=2){
    const gap=Math.round(s.fame-s.rivalFame);
    render(`<div class="age-mark">${s.age} 歲</div><h2>你又點進去看了</h2>
      <div class="rival"><div class="eyebrow">${s.rivalName}</div><div class="n">${Math.round(s.rivalFame)}</div>
      <div class="muted" style="margin-top:6px">你：${Math.round(s.fame)}　${gap>=0?'你在前面':'差距 '+Math.abs(gap)}</div></div>
      <p class="muted">你的滿意度不是算你有多少，是算你比他少多少。</p>
      <div class="opts"><button class="opt" id="a">關掉，繼續做自己的事</button>
      <button class="opt" id="b">不再追蹤他（少一個比較對象，也少一個動力）</button></div>`);
    document.getElementById('a').onclick=()=>{s.bias-=gap<0?4:-1;advance();turn()};
    document.getElementById('b').onclick=()=>{s.comparing=false;s.stopCompareAge=s.age;s.bias+=3;advance();turn()};
    return}
  advance();turn();
}

function advance(){
  const s=S;
  s.history.push({age:s.age,real:Math.round(s.craft),self:shown(s),fame:Math.round(s.fame)});
  s.age++;s.year++;
  s.pts+=(s.age<=22?2:1);
  if(s.age>33){s.craft-=0.9+(s.age-33)*0.12;s.body-=1.1*trM(s,'wear')}
  if(s.age>28)s.fame-=0.6;
  s.body+=0.2-(0.6+s.fame/45)*trM(s,'wear');   // 越忙磨越快，讓第四格永遠是活的
  s.craft+=(1-s.yips/140)*(s.body<40?0.4:0.85)*trM(s,'craft');
  s.bias*=0.985;
  s.money+=Math.min(5.5,s.fame/11)-2.6+C(s).inc;
  s.craft=clamp(s.craft,1,100);s.fame=clamp(s.fame,0,100);s.body=clamp(s.body,0,100);
}

/* ===== 十一種結局 ===== */
function resolveEnding(s,how){
  const c=s.career,multi=s.path.length>2,N=CAREERS[c].n;
  const TK=t=>/最高/.test(t)?'high':/最低/.test(t)?'low':/失敗/.test(t)?'fail':'mid';
  if(how==='broke')return{k:'撐不住了',role:`一個離開音樂的${N}`,tier:'失敗結局',s:'錢先到期，不是你。',
    l:'你把器材賣掉的那天，買家問你「你以前是做什麼的」。'};
  if(how==='body')return{k:({singer:'聲音沒了',producer:'耳朵沒了',writer:'寫不出來了',session:'手沒了',teacher:'燒完了'})[c],
    role:`一個提早退場的${N}`,tier:'失敗結局',s:'你把它整個燒掉了。每一次當下都很划算。',
    l:'最後那次是很小的事。小到你事後說起來，別人都不太懂。'};
  let r,low=false;
  if(c==='singer'){
    if(s.fame>55)r={k:'最後一場',role:'一個紅過的歌手',tier:'歌手線的最高結局',s:'你走到了你想去的位置，然後自己走下來。',l:'安可完，你站在台上看了很久才走。'};
    else if(s.fame>32)r={k:'一首歌',role:'一個有一首代表作的歌手',tier:'歌手線的中間結局',s:'你有一首大家都會唱的歌，然後就沒有了。',l:'每次自我介紹，對方都會說出那首歌的名字，然後停住。'};
    else{low=true;r={k:'沒有被記住的那個聲音',role:'一個普通的歌手',tier:'歌手線的最低結局',s:'你唱得比很多紅的人好。這件事沒有任何用處，但它是真的。',l:'某年某個小場子，有七個人是專程來的。你記得那七張臉。'}}
  }else if(c==='producer'){
    if(s.fame>28)r={k:'幕後',role:'一個有名的製作人',tier:'製作人線的最高結局',s:'你的名字在小字裡，但內行的人都知道。',l:'頒獎典禮上有人謝了你。鏡頭找了你三秒，你剛好在低頭。'};
    else{low=true;r={k:'工程檔',role:'一個普通的製作人',tier:'製作人線的最低結局',s:'你做過的東西比你有名很多。',l:'那些資料夾的名字都是日期。你自己還記得每一個裡面有什麼。'}}
  }else if(c==='writer'){
    if(s.craft>66&&s.fame<44)r={k:'歌比你活得久',role:'一個作品比自己有名的詞曲作者',tier:'詞曲線的最高結局',s:'很多人會唱那首，沒什麼人知道是你。',l:'有一天你在早餐店聽到它，老闆娘跟著哼，哼錯了一個字。'};
    else if(s.fame>44)r={k:'有名字的作者',role:'一個成名的詞曲作者',tier:'詞曲線的最高結局',s:'他們開始在歌名後面加上你。',l:'新人來找你的時候會先說「我是聽你寫的歌長大的」。'};
    else{low=true;r={k:'抽屜',role:'一個普通的詞曲作者',tier:'詞曲線的最低結局',s:'你寫了很多，交出去的是少數。',l:'那個資料夾一直在。你每年會打開一次，改一個字。'}}
  }else if(c==='session'){
    if(s.craft>73)r={k:'一直有工作的那個人',role:'一個一流的樂手',tier:'樂手線的最高結局',s:'沒有人為你買票，但每個人都想約你。',l:'你的名字在 credit 的第四行。四十年來，一直在。'};
    else{low=true;r={k:'第四行',role:'一個普通的樂手',tier:'樂手線的最低結局',s:'你在很多張唱片裡，沒有一張是你的。',l:'有次你女兒問你是做什麼的。你想了三秒才回答。'}}
  }else{
    if(s.student>16)r={k:'他們的老師',role:'一個被記住的音樂老師',tier:'老師線的最高結局',s:'你的名字在別人的謝辭裡。',l:'你這輩子最好的作品會走路，而且不姓你的姓。'};
    else{low=true;r={k:'教過的那些人',role:'一個普通的音樂老師',tier:'老師線的最低結局',s:'你沒有紅，但你在很多人的第一年裡。',l:'路上被叫住的機率，比你當年上台的次數還高。'}}
  }
  if(multi&&low)return{k:'換過位置的人',role:`一個換過位置的${N}`,tier:'中間結局',s:'你不是放棄，你是換了一個離音樂比較近的位子。',
    l:'年輕的時候你以為那是退讓。現在你知道那只是換一種待著的方法。'};
  return r;
}


/* ===== 評語：從這一局實際發生的事組出來，不是罐頭 ===== */

/* ===== 最終身分：規模＋路線＋職業，組出一句明確的話 ===== */
const SWMIN={singer:1,teacher:2,producer:2,writer:2,session:1};
const CUTS={singer:{f88:75,gHi:-7,f68:47,gLo:-52,f12:24},teacher:{f88:48,gHi:-23,f68:30,gLo:-58,f12:11},producer:{f88:54,gHi:-22,f68:29,gLo:-61,f12:11},writer:{f88:49,gHi:-21,f68:29,gLo:-58,f12:13},session:{f88:56,gHi:-29,f68:40,gLo:-64,f12:14}};
function identityOf(s,tk){
  const c=s.career,f=s.fame,cr=s.craft,K=CUTS[c],gap=f-cr;
  const NOUN={
   singer:{high:'流行歌手',mid:'專職歌手',low:'業餘歌手',fail:'半途退場的歌手'},
   producer:{high:'幕後製作人',mid:'專職製作人',low:'接案製作人',fail:'半途退場的製作人'},
   writer:{high:'職業詞曲作者',mid:'接案寫歌人',low:'抽屜寫歌人',fail:'半途退場的寫歌人'},
   session:{high:'一線錄音室樂手',mid:'專職樂手',low:'兼差樂手',fail:'半途退場的樂手'},
   teacher:{high:'資深音樂老師',mid:'專職音樂老師',low:'兼課音樂老師',fail:'半途退場的音樂老師'}
  }[c][tk];
  if(tk==='fail') return `你最後是一個${NOUN}。`;
  // 門檻取自各職業自己的分位，這樣老師不會被拿歌手的尺去量
  let mod;                                  // 由好到壞，切點取自各職業自己的實測分位
  if(f>=K.f88) mod='全國都知道的';
  else if(gap>=K.gHi) mod='名氣跑在實力前面的';
  else if(f>=K.f68) mod='小有名氣的';
  else if(gap<=K.gLo) mod='硬底子的';
  else if(f<=K.f12) mod='沒沒無聞的';
  else if(s.path.length-1>=SWMIN[c]) mod='半路出家的';
  else mod='小圈子裡的';
  return `你最後是一個${mod}${NOUN}。`;
}

function lifeVerdict(s,E,maxGap,dom){
  const c=C(s),gap=maxGap.self-maxGap.real,L=[];
  const RV=/^[A-Za-z]/.test(s.rivalName)?' '+s.rivalName+' ':s.rivalName;
  // 標題：這一生的一句話
  let head;
  const good=/最高/.test(E.tier),midt=/中間/.test(E.tier),fail=/失敗/.test(E.tier);
  const CL=c.craftL,BL=c.bodyL,FL=c.fameL;
  if(good&&s.craft>=75) head=`你的${CL}是真的練出來的`;
  else if(good&&s.student>16) head='你教出來的人，比你走得遠';
  else if(good&&s.fame>=55&&gap>=12) head=`你紅了，但沒有你以為的那麼強`;
  else if(good&&s.fame>=55) head='你想被聽見，然後你被聽見了';
  else if(good&&Math.abs(gap)<10) head='你一直知道自己有幾分';
  else if(good&&s.stopCompareAge) head='你不看別人之後，反而做得更好';
  else if(good&&s.trap===0&&s.pushed===0) head='你走到了，而且沒有把自己弄壞';
  else if(good) head='你到了你想去的地方';
  else if(gap<=-12) head='你比你以為的好很多';
  else if(s.chase>=2) head='你輸了就想賭回來';
  else if(s.trap>=2) head='你越怕出錯，就越出錯';
  else if(s.pushed>=2) head=`你把${BL}用完了才停下來`;
  else if(gap>=15&&s.fame>45) head=`你的名氣長得比${CL}快`;
  else if(gap>=15) head='你一直以為自己比實際上好';
  else if(midt&&s.body>=70&&s.age>=40) head='你沒有大紅，但你完好地走完了';
  else if(s.stopCompareAge) head=`你花了 ${s.stopCompareAge-16} 年才學會不看別人`;
  else if(fail) head='你沒有走完，可是你走過';
  else head='你沒有紅，但你一直在做';

  // 一、定調
  if(gap>=15) L.push(`你這一生最常做的事，是把自己想得比實際上好——${maxGap.age} 歲那年差得最遠，你以為自己 ${maxGap.self}，其實 ${maxGap.real}。`);
  else if(gap<=-12) L.push(`你這一生最常做的事，是低估自己。${maxGap.age} 歲你給自己打 ${maxGap.self}，實際上是 ${maxGap.real}，而你在那一年想過放棄。`);
  else L.push(`你對自己的判斷一直很準，最大落差只有 ${Math.abs(gap)} 分。這比你以為的稀有。`);

  // 二、你把命花在哪
  const sp=Object.entries(s.spent).sort((a,b)=>b[1]-a[1])[0];
  const spent={craft:`你把時間都給了${c.craftL}。那是最慢、也最不會背叛你的一條路。`,
    fame:`你把時間都給了${c.fameL}。數字漲得快，塌得也快。`,
    body:`你花最多力氣在保住${c.bodyL}——因為你比別人早知道那個會壞。`,
    mind:'你花最多力氣在整理自己的腦袋。沒有人看得到這部分。'};
  L.push((sp&&sp[1]>0)?spent[sp[0]]:'你沒有特別練什麼，就這樣一路過來了。');

  // 三、你的代價
  if(s.chase>=2) L.push(`你賭了 ${s.bets} 次，其中 ${s.chase} 次是在剛輸完之後又押下去。人在輸的時候最想把它賺回來，而那正是輸得最兇的時候。`);
  else if(s.trap>=2) L.push(`大場面你踩了 ${s.trap} 次白熊。每一次你都先告訴自己不要出錯，然後就出錯了。`);
  else if(s.pushed>=2) L.push(`你硬撐了 ${s.pushed} 次，${c.bodyL}最後剩 ${Math.round(s.body)}。當下每一次都很划算。`);
  else if(!s.comparing&&s.stopCompareAge) L.push(`${s.stopCompareAge} 歲你關掉了${RV}的消息。那大概是你做過最健康的一個決定，雖然你也因此少了一個逼自己的理由。`);
  else if(s.comparing&&s.rivalFame>s.fame+10) L.push(`你比較了一輩子，而且到最後還是輸給${RV}——${Math.round(s.rivalFame)} 比 ${Math.round(s.fame)}。`);
  else if(s.optimism<35) L.push('你對失敗的解釋一直很嚴厲。那讓你看得清楚，也讓你每次低潮都特別長。');
  else if(s.optimism>65) L.push('你總能替失敗找到出口。那讓你撐下來了，代價是你對自己的判斷越來越鬆。');
  else if(/最高/.test(E.tier)&&s.trap===0&&s.pushed===0) L.push(`大場面你一次都沒有崩過，${c.bodyL}也還剩 ${Math.round(s.body)}。那不是運氣，是你自己留下的餘裕。`);
  else L.push('你沒有特別大的毛病，也沒有特別大的運氣。');

  // 四、總評
  const tail={'最高':'你到了。至於那是不是你十六歲那年想去的地方，只有你知道。',
    '中間':'不上不下，但你一直都在。這件事本身就有分量。',
    '最低':'不會有人寫你的傳記。可是你做的東西真的存在過，這兩件事沒有矛盾。',
    '失敗':'你沒有走完。但走過的那一段是真的，沒有人能把它拿走。'};
  const tier=/失敗/.test(E.tier)?'失敗':(/最高/.test(E.tier)?'最高':(/最低/.test(E.tier)?'最低':'中間'));
  L.push(tail[tier]);
  return {head,body:L};
}

function ending(how){
  const s=S;s.over=true;
  s.history.push({age:s.age,real:Math.round(s.craft),self:shown(s),fame:Math.round(s.fame)});
  document.body.classList.add('lights-on');
  const c=C(s),E=resolveEnding(s,how);
  const peakReal=s.history.reduce((a,b)=>b.real>a.real?b:a,s.history[0]);
  const maxGap=s.history.reduce((a,b)=>Math.abs(b.self-b.real)>Math.abs(a.self-a.real)?b:a,s.history[0]);
  const avg=s.works?Math.round(s.worksSum/s.works):0;
  const end=s.log[s.log.length-1]||{line:'什麼都沒發生。',age:s.age,aud:null};
  const before=s.log.slice(0,-1);
  const peak=before.length?before.reduce((a,b)=>b.int>a.int?b:a):end;
  const cnt={};s.attrib.forEach(k=>cnt[k]=(cnt[k]||0)+1);
  const dom=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  const AN={'internal-stable':'把失敗歸給自己、而且覺得改不了','external':'把失敗歸給環境',
    'global':'把一次失敗放大成「我永遠不行」','specific':'把失敗限縮在這一次'};
  const an=AN[dom?dom[0]:'specific'];
  const pathStr=s.path.map(p=>`${p.age}歲 ${CAREERS[p.c].n}`).join(' → ');
  const taughtLine=s.taught?`<li><b>你教別人的解釋方式：</b>你自己最常${an}，但你叫學生${AN[s.taught]}。${s.taught===dom?.[0]?'你把自己那一套原封不動傳下去了。':'你給了他一個你自己沒用過的版本。'}</li>`:'';

  app.innerHTML=`<div class="ending">
    <div class="eyebrow">${s.year}</div>
    <div class="endtitle">${E.k}</div>
    <p class="muted">${E.s}</p>
    <div class="verdict"><b>${identityOf(s,/最高/.test(E.tier)?'high':/最低/.test(E.tier)?'low':/失敗/.test(E.tier)?'fail':'mid')}</b><span>${E.role}　·　${E.tier}</span></div>
    <div class="path">${pathStr}　·　${s.age}歲　·　${s.name}</div>
    <div class="doc ledger"><div class="stamp">DOCUMENT 1 — 記錄簿・實際數字</div>
      <div class="row"><span>${c.metric}</span><span>${s.works}</span></div>
      <div class="row"><span>平均觸及</span><span>${avg} ${c.unit}</span></div>
      <div class="row"><span>最好的一次</span><span>${s.peakWork} ${c.unit}</span></div>
      <div class="row"><span>真實${c.craftL}最高點</span><span>${peakReal.age} 歲（${peakReal.real}）</span></div>
      <div class="row"><span>那一年你給自己打</span><span>${peakReal.self}</span></div>
      <div class="row"><span>${c.bodyL}剩下</span><span>${Math.round(s.body)}／100</span></div>
      ${s.student>0?`<div class="row"><span>你帶起來的人</span><span>${Math.round(s.student)}</span></div>`:''}
      <div class="row"><span>存款</span><span>${rnd0(s.money)} 萬</span></div></div>
    <div class="doc memoir"><div class="stamp">DOCUMENT 2 — 回憶錄・由峰終定律生成</div>
      <h3>後來別人問起，你會這樣講：</h3>
      <p>「${peak.line}」——那是 ${peak.age} 歲。${peak.aud?`你記得那次大概${felt(s,peak.aud)}${peak.unit||c.unit}。`:''}</p>
      <p>然後就到最後了。「${end.line}」</p>
      <p style="font-family:'Noto Serif TC',serif">${E.l}</p>
      <p style="color:#7a6f62;font-size:.86rem;font-family:'Noto Sans TC',sans-serif;line-height:1.7">
      中間那 ${Math.max(0,s.log.length-2)} 件事沒有出現在這裡。不是你忘了，是記憶本來就只留最高的那一點和最後的那一點。</p></div>
    ${chart(s.history,c)}
    <div class="gap"><h3>覺察報告</h3><ul>
      <li><b>自評與真實的最大落差</b>在 ${maxGap.age} 歲：你以為自己 ${maxGap.self}，實際上 ${maxGap.real}。${maxGap.self>maxGap.real?'你高估了自己，然後接下了扛不住的東西。':'你低估了自己，在你最強的時候想放棄。'}</li>
      <li><b>歸因風格：</b>你最常${an}。${s.optimism>60?'復原很快，代價是你對自己的判斷越來越不準。':s.optimism<40?'你看自己看得很清楚，代價是每次低潮都特別長。':'你在兩者之間搖擺。'}</li>
      ${taughtLine}
      <li><b>你把點數花在：</b>${(()=>{const L={craft:C(s).craftL,fame:C(s).fameL,body:C(s).bodyL,mind:'心理素質'};
        const e=Object.entries(s.spent).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
        return e.length?e.map(([k,v])=>`${L[k]} ${v}`).join('、'):'什麼都沒練';})()}。</li>
      <li><b>天賦（${s.vtype}・${TR(s).n}型）：</b>${TR(s).dEnd}。</li>
      <li><b>白熊陷阱：</b>踩了 ${s.trap} 次。越告訴自己「不要出錯」，負責監控那個念頭的大腦就一直把它叫出來。</li>
      ${s.bets?`<li><b>賭局：</b>你賭了 ${s.bets} 次，贏 ${s.betWins} 次（照標示的機率，期望值是 ${s.betExp.toFixed(1)} 次）。${s.betNear?`其中 ${s.betNear} 次是差一點——差一點在大腦裡跟贏很像，所以它讓人想再賭一次。`:''}${s.chase>=1?`有 ${s.chase} 次你是在剛輸完之後又押下去的，那叫追損。`:''}</li>`:''}
      <li><b>${c.bodyL}：</b>你硬撐了 ${s.pushed} 次。每一次當下都很划算。</li>
      <li><b>社會比較：</b>${s.stopCompareAge?`你在 ${s.stopCompareAge} 歲停止追蹤${s.rivalName}。之後自我評價穩定了，動力也少了一塊。`:`你比較了一輩子。${s.rivalName}最後是 ${Math.round(s.rivalFame)}，你是 ${Math.round(s.fame)}。`}</li>
    </ul></div>
    ${(()=>{const V=lifeVerdict(s,E,maxGap,dom);
      return `<div class="doc verdict-doc"><div class="stamp">DOCUMENT 4 — 評語・你的這一生</div>
        <h3 class="vhead">${V.head}</h3>${V.body.map(p=>`<p>${p}</p>`).join('')}</div>`;})()}
    <p class="muted" style="text-align:center">世界種子 <b class="mono">${s.seed}</b><br>
      <button id="copySeed" style="margin-top:8px;padding:8px 14px;background:none;border:1px solid #c9bda6;color:#6d6259;border-radius:2px;font-family:'Space Mono',monospace;font-size:.72rem;cursor:pointer">複製連結給朋友</button><br>
      <span style="font-size:.8rem">同一顆種子，數據會一樣，回憶錄不會。</span></p>
    <button class="primary" id="again" style="background:var(--ink);color:var(--paper)">再活一次</button>
    <p class="footer">回音 ECHO — 概念原型</p></div>`;
  document.getElementById('again').onclick=()=>{document.body.classList.remove('lights-on');titleScreen()};
  const cs=document.getElementById('copySeed');
  if(cs)cs.onclick=()=>{const u=location.origin+location.pathname+'?seed='+encodeURIComponent(s.seed);
    (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject())
      .then(()=>cs.textContent='已複製 ✓').catch(()=>cs.textContent=s.seed)};
  window.scrollTo(0,0);
}

function chart(h,c){
  const W=520,H=190,pl=30,pr=10,pt=16,pb=24;
  const x=i=>pl+(W-pl-pr)*(i/(h.length-1||1));
  const y=v=>pt+(H-pt-pb)*(1-v/100);
  const line=(k,col)=>`<polyline fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" points="${h.map((p,i)=>x(i)+','+y(p[k])).join(' ')}"/>`;
  const ticks=h.map((p,i)=>({p,i})).filter(o=>o.i%5===0||o.i===h.length-1)
    .map(o=>`<text class="lbl" fill="#9a8f7e" x="${x(o.i)}" y="${H-6}" text-anchor="middle">${o.p.age}</text>`).join('');
  return `<div class="doc" style="padding:18px 14px">
    <div class="stamp" style="padding-left:8px">DOCUMENT 3 — 你以為的你 ／ 你</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="自評與真實對照圖">
      <line x1="${pl}" y1="${y(0)}" x2="${W-pr}" y2="${y(0)}" stroke="#ddd2bd"/>
      <line x1="${pl}" y1="${y(100)}" x2="${W-pr}" y2="${y(100)}" stroke="#f0e9dc"/>
      ${line('real','#24201c')}${line('self','#c98a1e')}${ticks}
      <text class="lbl" fill="#9a8f7e" x="4" y="${y(100)+4}">100</text></svg>
    <div class="legend" style="padding-left:8px">
      <span><i class="swatch" style="background:#24201c"></i>真實${c.craftL}</span>
      <span><i class="swatch" style="background:#c98a1e"></i>你以為的自己</span></div></div>`;
}
titleScreen();
</script>
</body>
</html>
